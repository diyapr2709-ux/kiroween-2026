[project]
name = "hollerith"
version = "0.1.0"
description = "Hollerith's Ghost - a knowledge graph where every fact is an IBM 80-column punched card"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=2"]

[project.scripts]
hollerith = "hollerith.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hollerith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
